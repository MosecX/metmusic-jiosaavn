name: Build
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Optional: without these secrets the APK is signed with the debug key
      # (see android/app/build.gradle.kts fallback), which is still installable
      # on devices. Add the secrets later to get a proper release signature.
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No signing secrets configured — APK will be signed with the debug key."
            exit 0
          fi
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetMusic-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      # Optional: publishes to the CDN repo only when CDN_TOKEN is configured.
      - name: Publish APK to CDN repo
        env:
          CDN_TOKEN: ${{ secrets.CDN_TOKEN }}
        run: |
          if [ -z "$CDN_TOKEN" ]; then
            echo "CDN_TOKEN not configured — skipping CDN publish (artifact already uploaded)."
            exit 0
          fi
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          SHORT_SHA=$(git rev-parse --short HEAD)
          git clone --depth 1 "https://x-access-token:${CDN_TOKEN}@github.com/MosecX/cdn.tinvoxdevelopment.git" cdn-repo
          cd cdn-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "metmusic/${VERSION}-${SHORT_SHA}" metmusic/latest
          cp ../build/app/outputs/flutter-apk/app-release.apk "metmusic/${VERSION}-${SHORT_SHA}/MetMusic-${VERSION}-${SHORT_SHA}.apk"
          cp ../build/app/outputs/flutter-apk/app-release.apk metmusic/latest/MetMusic.apk
          git add metmusic
          git diff --cached --quiet || git commit -m "MetMusic APK ${VERSION} (${SHORT_SHA}) [skip ci]"
          git push

  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath MetMusic-Windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MetMusic-Windows-EXE
          path: MetMusic-Windows.zip
          retention-days: 7
